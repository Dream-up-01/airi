perception-screen:
  tab: Desktop
  title: Trusted desktop observation
  description: Choose one screen or window. AIRI analyzes sparse changed frames with the approved local model.
  privacy-notice: Frames stay in memory, are processed locally, and are never saved to history or logs. AIRI's own window is excluded from capture.
  local-only: Local only
  indicator-description: Desktop observation is visible and can be paused or stopped at any time.
  source-label: Screen or window
  select-source: Select a source
  refresh: Refresh
  refreshing: Refreshing…
  no-sources: No eligible external screen or window was found.
  consent: I allow AIRI to observe the selected source locally for this session. I understand sensitive surfaces are automatically paused and I can stop at any time.
  sensitive-pause: Pause analysis for a sensitive surface
  start: Start observation
  starting: Starting local model…
  pause: Pause
  stop: Stop and revoke
  enter-privacy-pause: Privacy pause
  leave-privacy-pause: Leave privacy pause
  fact-count: '{count} fresh facts'
  view-results: View observation results
  facts-title: Trusted facts and diagnostics
  fact-counts: '{accepted} accepted · {suppressed} suppressed · {revoked} withdrawn'
  no-facts: No bounded fact is currently available. Raw frames and model responses are never shown here.
  value-redacted: The free-form value was withheld from diagnostics.
  user-confirmed: User confirmed
  fact-metadata: '{confidence}% confidence · {age}s old · TTL {ttl}s · {source}/{processing}'
  suppression-reason: 'Suppressed: {reason}'
  confirm-fact: Confirm
  correct-fact: Not correct
  clear-facts: Clear current session facts
  capture-profile: '{resolution} · target {cadence}'
  capture-counts: '{attempts} sampled · {accepted} accepted · {dropped} dropped · {facts} fact results'
  error-with-code: 'Desktop observation could not continue ({code}). No frame was retained.'
  state:
    idle: Desktop observation off
    starting: Starting desktop observation
    running: Desktop observation active
    paused: Desktop observation paused
    stopping: Stopping desktop observation
    failed: Desktop observation failed
perception-camera:
  tab: Camera
  title: Trusted local camera perception
  description: MediaPipe, OpenCV.js 4.13.0, and YOLOX-Nano turn current frames into short-lived objective facts.
  privacy-notice: Camera frames stay in memory and are processed only on this device. No microphone, cloud upload, recording, identity recognition, or frame history is enabled.
  local-only: Local camera only
  indicator-description: The camera is currently in use for local perception. Stop immediately to release the track and all analyzers.
  consent: I allow AIRI to use my camera locally for this session and derive only the listed objective facts. I can stop and revoke access at any time.
  start: Start camera perception
  starting: Starting local analyzers…
  pause: Pause
  stop: Stop and revoke
  capture-profile: 640×360 · MediaPipe/OpenCV up to 10 Hz · YOLO up to 2 Hz
  capture-counts: '{observations} working frames · {dropped} dropped · {facts} fresh facts'
  error-with-code: 'Local camera perception could not continue ({code}). No frame was retained.'
  analyzer:
    mediapipe: MediaPipe pose/hands/face cues
    opencv: OpenCV.js 4.13.0 quality/motion
    yolo: YOLOX-Nano allowlisted objects
  analyzer-state:
    stopped: Stopped
    starting: Starting
    ready: Ready
    degraded: Degraded
    failed: Failed
  state:
    idle: Camera perception off
    starting: Starting camera perception
    running: Camera perception active
    paused: Camera perception paused
    stopping: Stopping camera perception
    failed: Camera perception failed
