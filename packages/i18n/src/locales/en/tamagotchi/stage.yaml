perception-minecraft:
  tab: Minecraft
  title: Trusted Minecraft perception
  description: Accept only authenticated, schema-valid game events and turn them into short-lived objective facts.
  privacy-notice: Processing is local and event-driven. Free-form game text and instructions are ignored; no screen, camera, microphone, or cloud access is used.
  runtime: Authenticated runtime
  processing: Processing
  local-structured: Local structured events
  indicator-description: Authenticated structured game perception is active and can be paused or revoked at any time.
  indicator-status: '{connected} · {facts} fresh facts'
  connected: Runtime connected
  disconnected: Runtime unavailable
  no-runtime-context: No authenticated Minecraft runtime has been observed.
  waiting-help: AIRI is enabled and waiting for Minecraft. In the game, press K, allow this session, connect to AIRI, then compare and approve the pairing code below.
  runtime-context-stale: The last structured game update is stale.
  runtime-context-age: 'Last structured game update: {seconds}s ago'
  counts: '{accepted} accepted · {rejected} rejected · {suppressed} suppressed'
  last-rejection: 'Most recent sanitized rejection: {code}'
  consent: I allow AIRI to use authenticated structured Minecraft events for this session. I can pause or revoke access at any time.
  start: Enable game perception
  pause: Pause
  resume: Resume
  stop: Stop and revoke
  pairing:
    title: Minecraft device pairing
    refresh: Refresh
    request: 'Confirm that the game also shows code {code}, then approve the device.'
    approve: Approve pairing
    reject: Reject
    revoke: Revoke device
    empty: No pairing request is waiting. A request will appear here after the Mod connects.
    error: Pairing status is unavailable. Confirm that the updated AIRI build is running.
    notification:
      title: Minecraft pairing request
      body: '{device} is waiting to pair. Confirm that the game shows code {code}, then approve it here.'
  state:
    off: Game perception off
    waiting: Waiting for authenticated runtime
    running: Game perception active
    paused: Game perception paused
    failed: Game perception failed
